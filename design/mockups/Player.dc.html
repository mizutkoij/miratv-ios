<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>再生（縦）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F5A524}a:hover{color:#FFC35C}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D1014; color: #ECEEF1; font-family: 'Zen Kaku Gothic New', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="height: 54px; background: #000"></div>

  <section aria-label="映像" style="position: relative; width: 390px; height: 219px; background: #05070A; display: flex; align-items: center; justify-content: center">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #4A525D">[映像 1440×1080 → 16:9]</span>
    <a href="Main.dc.html" aria-label="閉じる" style="position: absolute; top: 8px; left: 8px; width: 36px; height: 36px; border-radius: 18px; background: rgba(0,0,0,0.55); color: #fff; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </a>
    <sc-if value="{{captions}}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center">
        <p style="margin: 0; padding: 3px 10px; background: rgba(0,0,0,0.72); color: #fff; font-size: 15px; font-weight: 500; line-height: 1.45; text-align: center">（解説）字幕はここに重ねて表示<br><span style="color: #FFE45C">黄色・色付き字幕もそのまま</span></p>
      </div>
    </sc-if>
  </section>

  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; padding: 10px 12px; border-bottom: 1px solid #1E232B">
    <button aria-pressed="{{captions}}" onClick="{{toggleCaptions}}" style="height: 52px; border-radius: 12px; border: 1px solid {{capBorder}}; background: {{capBg}}; color: {{capFg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="M7 13h4M13 13h4M7 16h7"></path></svg>
      <span>字幕</span>
    </button>
    <button style="height: 52px; border-radius: 12px; border: 1px solid #262C35; background: #161A20; color: #ECEEF1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 500">
      <span style="font-size: 15px; font-weight: 700; line-height: 20px">主</span>
      <span>音声</span>
    </button>
    <a href="DataBroadcast.dc.html" style="text-decoration: none; height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px solid #262C35; background: #161A20; color: #ECEEF1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 500">
      <span style="width: 20px; height: 20px; border-radius: 5px; border: 1.8px solid currentColor; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600">d</span>
      <span>データ</span>
    </a>
    <button style="height: 52px; border-radius: 12px; border: 1px solid #262C35; background: #161A20; color: #ECEEF1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 500">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><rect x="12" y="11" width="6" height="5" rx="1"></rect></svg>
      <span>PiP</span>
    </button>
    <a href="PlayerLandscape.dc.html" style="text-decoration: none; height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px solid #262C35; background: #161A20; color: #ECEEF1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 500">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>
      <span>全画面</span>
    </a>
  </div>

  <section aria-label="番組情報" style="padding: 16px 20px 14px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #9AA3AE">
      <span aria-hidden="true" style="width: 40px; height: 22px; border-radius: 4px; background: #E9ECEF; color: #5A6370; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 7px; font-weight: 600; letter-spacing: 0.06em">LOGO</span>
      <span style="font-weight: 500"><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: {{accent}}">5</span> テレビ朝日</span>
      <span>·</span>
      <span style="font-family: 'IBM Plex Mono', monospace">18:00–20:54</span>
      <a href="Quality.dc.html" style="margin-left: auto; text-decoration: none; min-height: 28px; display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #ECEEF1; border: 1px solid #343B45; border-radius: 14px; padding: 0 10px">原画質 · 5.1ch
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </a>
    </div>
    <h2 style="margin: 0; font-size: 21px; font-weight: 700; line-height: 1.35">[プロ野球中継]</h2>
    <div style="height: 3px; border-radius: 2px; background: #262C35; overflow: hidden"><div style="height: 3px; width: 22%; background: {{accent}}"></div></div>
    <p style="margin: 0; font-size: 13px; color: #9AA3AE; line-height: 1.6">[番組概要：EPG の extended テキストをここに表示。長い場合は3行で折りたたみ]</p>
  </section>

  <section aria-label="ほかのチャンネル" style="display: flex; flex-direction: column; gap: 10px; padding: 6px 0 0">
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 20px">
      <h3 style="margin: 0; font-size: 15px; font-weight: 700">ほかのチャンネル</h3>
      <span style="font-size: 12px; color: #8C95A1">左右スワイプで選局</span>
    </div>
    <div style="display: flex; gap: 10px; padding: 0 20px; overflow: hidden">
      <sc-for list="{{others}}" as="o" hint-placeholder-count="4">
        <a href="Player.dc.html" style="text-decoration: none; color: inherit; flex: 0 0 148px; display: flex; flex-direction: column; gap: 6px">
          <div style="height: 83px; border-radius: 10px; background: #161A20; border: 1px solid #1E232B; display: flex; flex-direction: column; justify-content: space-between; padding: 7px 8px; box-sizing: border-box">
            <span aria-hidden="true" style="width: 48px; height: 27px; border-radius: 4px; background: #E9ECEF; color: #5A6370; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 8px; font-weight: 600; letter-spacing: 0.06em">LOGO</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; align-self: flex-end">{{o.key}}</span>
          </div>
          <span style="font-size: 12px; color: #9AA3AE">{{o.name}}</span>
          <span style="font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{o.title}}</span>
        </a>
      </sc-for>
    </div>
  </section>

  <section aria-label="この後" style="margin: 18px 20px 0; padding-top: 14px; border-top: 1px solid #1E232B; display: flex; flex-direction: column; gap: 10px">
    <h3 style="margin: 0; font-size: 15px; font-weight: 700">このあと</h3>
    <div style="display: flex; gap: 12px; align-items: baseline">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #8C95A1; width: 44px">20:54</span>
      <span style="font-size: 14px">[報道番組]</span>
    </div>
    <div style="display: flex; gap: 12px; align-items: baseline">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #8C95A1; width: 44px">21:54</span>
      <span style="font-size: 14px">[ドラマ]</span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5A524","options":["#F5A524","#4CC3FF","#FF6B5A","#9B8CFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { captions: true };
  }
  renderVals() {
    const accent = this.props.accent ?? '#F5A524';
    const on = this.state.captions;
    return {
      accent,
      captions: on,
      toggleCaptions: () => this.setState({ captions: !on }),
      capBg: on ? accent : '#161A20',
      capFg: on ? '#1A1205' : '#ECEEF1',
      capBorder: on ? accent : '#262C35',
      others: [
        { key: '1', name: 'NHK総合', title: '[ニュース番組]' },
        { key: '4', name: '日テレ', title: '[夕方ニュース]' },
        { key: '6', name: 'TBS', title: '[情報番組]' },
        { key: '8', name: 'フジテレビ', title: '[夕方ニュース]' },
      ],
    };
  }
}
</script>
</body>
</html>
