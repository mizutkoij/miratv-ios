<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>番組表</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F5A524}a:hover{color:#FFC35C}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D1014; color: #ECEEF1; font-family: 'Zen Kaku Gothic New', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 58px 20px 10px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700">番組表</h1>
      <span style="font-size: 13px; color: #9AA3AE">地上波 ▾</span>
    </div>
    <div style="display: flex; gap: 6px">
      <button style="height: 32px; padding: 0 12px; border-radius: 16px; border: none; background: {{accent}}; color: #1A1205; font-size: 13px; font-weight: 700">今日 16(金)</button>
      <button style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #262C35; background: #161A20; color: #B4BCC6; font-size: 13px">17(土)</button>
      <button style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #262C35; background: #161A20; color: #B4BCC6; font-size: 13px">18(日)</button>
      <button style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #262C35; background: #161A20; color: #B4BCC6; font-size: 13px">19(月)</button>
    </div>
  </header>

  <div style="display: flex; padding-left: 40px; border-bottom: 1px solid #1E232B">
    <sc-for list="{{cols}}" as="c" hint-placeholder-count="3">
      <div style="flex: 0 0 116px; box-sizing: border-box; padding: 8px 8px; display: flex; gap: 6px; align-items: center; border-left: 1px solid #1E232B">
        <span aria-hidden="true" style="flex: 0 0 36px; height: 20px; border-radius: 3px; background: #E9ECEF; color: #5A6370; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 6px; font-weight: 600; letter-spacing: 0.06em">LOGO</span>
        <div style="display: flex; flex-direction: column; min-width: 0">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; line-height: 1.2">{{c.key}}</span>
          <span style="font-size: 11px; color: #9AA3AE; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: relative; flex: 1; overflow: hidden; display: flex">
    <div style="flex: 0 0 40px; display: flex; flex-direction: column">
      <sc-for list="{{hours}}" as="h" hint-placeholder-count="5">
        <div style="height: 120px; box-sizing: border-box; border-top: 1px solid #1E232B; padding: 4px 0 0 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; color: #9AA3AE">{{h}}</div>
      </sc-for>
    </div>
    <sc-for list="{{cols}}" as="c" hint-placeholder-count="3">
      <div style="position: relative; flex: 0 0 116px; border-left: 1px solid #1E232B">
        <sc-for list="{{c.progs}}" as="p" hint-placeholder-count="3">
          <a href="ProgramDetail.dc.html" style="position: absolute; left: 3px; right: 3px; top: {{p.top}}; height: {{p.height}}; box-sizing: border-box; padding: 6px 7px; border-radius: 8px; background: {{p.bg}}; border: 1px solid {{p.border}}; color: inherit; text-decoration: none; overflow: hidden; display: flex; flex-direction: column; gap: 2px">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8C95A1">{{p.start}}</span>
            <span style="font-size: 12px; font-weight: 700; line-height: 1.4">{{p.title}}</span>
            <sc-if value="{{p.reserved}}" hint-placeholder-val="{{ false }}">
              <span style="position: absolute; top: 5px; right: 5px; height: 16px; padding: 0 5px; border-radius: 8px; background: {{p.badgeBg}}; color: #1F0705; font-size: 10px; font-weight: 700; line-height: 16px">{{p.badge}}</span>
            </sc-if>
          </a>
        </sc-for>
      </div>
    </sc-for>
    <div style="position: absolute; left: 0; right: 0; top: {{nowTop}}; height: 0; border-top: 2px solid {{accent}}"></div>
    <span style="position: absolute; left: 2px; top: {{nowLabelTop}}; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; color: #1A1205; background: {{accent}}; border-radius: 4px; padding: 1px 4px">18:40</span>
  </div>

  <nav aria-label="メイン" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 8px 30px; border-top: 1px solid #1E232B; background: #0D1014">
    <a href="Main.dc.html" style="text-decoration: none; color: #8C95A1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"></rect><path d="M8 3l4 3 4-3"></path></svg>
      <span>チャンネル</span>
    </a>
    <a href="Guide.dc.html" style="text-decoration: none; color: {{accent}}; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"></rect><path d="M3 9h18M9 9v11M15 9v11"></path></svg>
      <span>番組表</span>
    </a>
    <a href="Radio.dc.html" style="text-decoration: none; color: #8C95A1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="9" width="18" height="11" rx="2.5"></rect><path d="M7 9l10-5"></path><circle cx="15.5" cy="14.5" r="2.5"></circle><path d="M6.5 13h4M6.5 16h4"></path></svg>
      <span>ラジオ</span>
    </a>
    <a href="Recordings.dc.html" style="text-decoration: none; color: #8C95A1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="3.5" fill="currentColor"></circle></svg>
      <span>録画</span>
    </a>
    <a href="#" style="text-decoration: none; color: #8C95A1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>
      <span>設定</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5A524","options":["#F5A524","#4CC3FF","#FF6B5A","#9B8CFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const PX = 2; // 1分 = 2px
    const base = 18 * 60;
    const now = 18 * 60 + 40;
    const toMin = (s) => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
    const mk = (list) => list.map(([start, end, title, res]) => {
      const a = toMin(start), b = toMin(end);
      const onAir = a <= now && now < b;
      return {
        start, title,
        reserved: !!res,
        badge: res === 'c' ? '競合' : '録',
        badgeBg: res === 'c' ? '#F5C04A' : '#FF5A4E',
        top: ((a - base) * PX) + 'px',
        height: ((b - a) * PX - 4) + 'px',
        bg: onAir ? '#221E14' : '#13171C',
        border: onAir ? '#4A3B1A' : '#1C2128',
      };
    });
    return {
      accent: this.props.accent ?? '#F5A524',
      hours: ['18', '19', '20', '21', '22'],
      nowTop: ((now - base) * PX) + 'px',
      nowLabelTop: ((now - base) * PX - 8) + 'px',
      cols: [
        { key: '1', name: 'NHK総合', progs: mk([['18:00', '18:45', '[ニュース番組]'], ['18:45', '19:00', '[気象情報]'], ['19:00', '19:30', '[ニュース]'], ['19:30', '20:45', '[紀行番組]'], ['20:45', '21:00', '[ニュース]'], ['21:00', '23:00', '[報道特集]', 'c']]) },
        { key: '4', name: '日テレ', progs: mk([['17:50', '19:00', '[夕方ニュース]'], ['19:00', '21:00', '[バラエティ]'], ['21:00', '22:54', '[映画]', 'c']]) },
        { key: '5', name: 'テレ朝', progs: mk([['18:00', '20:54', '[プロ野球中継]', 'r'], ['20:54', '21:54', '[報道番組]'], ['21:54', '23:00', '[ドラマ]']]) },
      ],
    };
  }
}
</script>
</body>
</html>
