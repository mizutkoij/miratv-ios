<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ラジオ局詳細</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F5A524}a:hover{color:#FFC35C}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D1014; color: #ECEEF1; font-family: 'Zen Kaku Gothic New', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 54px 12px 10px; display: flex; align-items: center; gap: 10px">
    <a href="Radio.dc.html" aria-label="戻る" style="width: 44px; height: 44px; border-radius: 22px; color: #ECEEF1; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span aria-hidden="true" style="flex: 0 0 64px; height: 32px; border-radius: 6px; background: #E9ECEF; color: #5A6370; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.06em">LOGO</span>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 18px; font-weight: 700">[局名 A]</h1>
      <span style="font-size: 12px; color: #9AA3AE">radiko · 関西</span>
    </div>
  </header>

  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 12px">
    <button style="text-align: left; padding: 14px; border-radius: 16px; border: 1px solid #3A3220; background: #1F1C15; color: #ECEEF1; display: flex; align-items: center; gap: 12px">
      <span style="width: 44px; height: 44px; border-radius: 22px; background: {{accent}}; color: #1A1205; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg>
      </span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 700">ライブで聴く</span>
        <span style="font-size: 12px; color: #B4BCC6">いま 09:00–11:00 [朝のワイド番組]</span>
      </span>
      <span style="font-size: 11px; font-weight: 700; color: #FF8A80">LIVE</span>
    </button>

    <div style="display: flex; gap: 6px; overflow: hidden">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="5">
        <button onClick="{{d.pick}}" style="flex: 0 0 auto; height: 32px; padding: 0 12px; border-radius: 16px; border: {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; font-size: 13px; font-weight: 700">{{d.label}}</button>
      </sc-for>
    </div>
  </div>

  <ul style="list-style: none; margin: 10px 0 0; padding: 0 16px; flex: 1; overflow: hidden; display: flex; flex-direction: column">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="7">
      <li style="border-bottom: 1px solid #1A1F26">
        <button onClick="{{it.pick}}" style="width: 100%; text-align: left; min-height: 56px; padding: 10px 0; border: none; background: transparent; color: #ECEEF1; display: flex; gap: 12px; align-items: center">
          <span style="flex: 0 0 48px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #9AA3AE">{{it.ft}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 14px; font-weight: 700; color: {{it.titleFg}}">{{it.title}}</span>
            <span style="font-size: 12px; color: {{it.subFg}}">{{it.sub}}</span>
          </span>
          <span style="flex: 0 0 auto; font-size: 11px; font-weight: 700; color: {{it.stateFg}}">{{it.state}}</span>
        </button>
      </li>
    </sc-for>
  </ul>

  <div style="margin: 0 8px 30px; padding: 10px 12px; border-radius: 16px; background: #1D222A; border: 1px solid #2A3038; display: flex; flex-direction: column; gap: 8px">
    <div style="height: 3px; border-radius: 2px; background: #2A3038; overflow: hidden"><div style="height: 3px; width: {{progress}}; background: {{accent}}"></div></div>
    <div style="display: flex; align-items: center; gap: 8px">
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{nowTitle}}</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #9AA3AE">{{nowStatus}}</span>
      </div>
      <button aria-label="15秒戻る" style="width: 44px; height: 44px; border: none; background: transparent; color: #ECEEF1; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600">-15</button>
      <button aria-label="再生" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: {{accent}}; color: #1A1205; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
      </button>
      <button aria-label="30秒進む" style="width: 44px; height: 44px; border: none; background: transparent; color: #ECEEF1; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600">+30</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5A524","options":["#F5A524","#4CC3FF","#FF6B5A","#9B8CFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { day: '昨日', picked: 2 };
  }
  renderVals() {
    const accent = this.props.accent ?? '#F5A524';
    const days = ['今日', '昨日', '14(水)', '13(火)', '12(月)', '11(日)'];
    const rows = [
      ['05:00', '[早朝番組]', '[出演者]', true],
      ['07:00', '[朝の情報番組]', '[出演者]', true],
      ['09:00', '[朝のワイド番組]', '[出演者] · [ゲスト]', true],
      ['11:00', '[昼の音楽番組]', '[DJ]', true],
      ['13:00', '[午後のワイド番組]', '[出演者]', true],
      ['16:00', '[夕方の番組]', 'アーカイブなし', false],
      ['18:00', '[ナイター中継]', '[実況]', true],
    ];
    const picked = this.state.picked;
    const items = rows.map(([ft, title, sub, ok], i) => {
      const sel = i === picked;
      const prefetched = i === picked + 1 && ok;
      return {
        ft, title, sub,
        pick: ok ? () => this.setState({ picked: i }) : undefined,
        titleFg: ok ? '#ECEEF1' : '#6B7480',
        subFg: ok ? '#9AA3AE' : '#5A6370',
        state: sel ? '再生中' : prefetched ? '次に再生' : ok ? '▶' : '',
        stateFg: sel ? accent : prefetched ? '#9AA3AE' : accent,
      };
    });
    const cur = rows[picked];
    return {
      accent,
      days: days.map((d) => {
        const sel = d === this.state.day;
        return { label: d, pick: () => this.setState({ day: d }),
          bg: sel ? accent : '#161A20', fg: sel ? '#1A1205' : '#B4BCC6', border: sel ? 'none' : '1px solid #262C35' };
      }),
      items,
      nowTitle: cur ? cur[1] : '',
      nowStatus: '昨日 ' + (cur ? cur[0] : '') + ' · 0:42:10 / 2:00:00',
      progress: '35%',
    };
  }
}
</script>
</body>
</html>
