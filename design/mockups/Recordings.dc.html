<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>録画</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F5A524}a:hover{color:#FFC35C}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D1014; color: #ECEEF1; font-family: 'Zen Kaku Gothic New', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 58px 20px 12px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700">録画</h1>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #9AA3AE">
        <span style="width: 7px; height: 7px; border-radius: 50%; background: #3DD68C"></span>
        <span>EPGStation 同期済み · 空き [容量]</span>
      </div>
    </div>
    <div role="tablist" aria-label="録画の種類" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #161A20; border-radius: 12px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="height: 36px; border: none; border-radius: 9px; background: {{t.bg}}; color: {{t.fg}}; font-size: 14px; font-weight: 700">{{t.label}}</button>
      </sc-for>
    </div>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 0 12px">
    <sc-if value="{{showReserves}}" hint-placeholder-val="{{ true }}">
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{reserves}}" as="r" hint-placeholder-count="5">
          <li style="display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 14px; background: #13171C; border: 1px solid {{r.border}}">
            <div style="flex: 0 0 52px; display: flex; flex-direction: column; align-items: center; gap: 2px">
              <span style="font-size: 11px; color: #9AA3AE">{{r.day}}</span>
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600">{{r.start}}</span>
            </div>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
              <span style="font-size: 12px; color: #9AA3AE">{{r.ch}}</span>
              <span style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
              <span style="font-size: 11px; color: {{r.tagFg}}; font-weight: 700">{{r.tag}}</span>
            </div>
            <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: {{r.dot}}"></span>
          </li>
        </sc-for>
      </ul>
    </sc-if>
    <sc-if value="{{showRecorded}}" hint-placeholder-val="{{ false }}">
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{recorded}}" as="v" hint-placeholder-count="4">
          <li>
            <a href="Player.dc.html" style="text-decoration: none; color: inherit; display: flex; gap: 12px; align-items: center">
              <div style="position: relative; flex: 0 0 136px; height: 76px; border-radius: 10px; background: #161A20; border: 1px solid #1E232B; display: flex; align-items: center; justify-content: center">
                <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #4A525D">[サムネイル]</span>
                <span style="position: absolute; right: 6px; bottom: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; background: rgba(0,0,0,0.75); padding: 1px 4px; border-radius: 3px">{{v.dur}}</span>
              </div>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
                <span style="font-size: 14px; font-weight: 700; line-height: 1.4">{{v.title}}</span>
                <span style="font-size: 12px; color: #9AA3AE">{{v.meta}}</span>
                <span style="font-size: 11px; color: #8C95A1">{{v.files}}</span>
              </div>
            </a>
          </li>
        </sc-for>
      </ul>
    </sc-if>
    <sc-if value="{{showRules}}" hint-placeholder-val="{{ false }}">
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{rules}}" as="u" hint-placeholder-count="3">
          <li style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: #13171C; border: 1px solid #1C2128">
            <div style="flex: 1; display: flex; flex-direction: column; gap: 3px">
              <span style="font-size: 15px; font-weight: 700">{{u.keyword}}</span>
              <span style="font-size: 12px; color: #9AA3AE">{{u.cond}}</span>
            </div>
            <span style="font-size: 12px; color: #B4BCC6">{{u.count}}</span>
          </li>
        </sc-for>
      </ul>
    </sc-if>
  </div>

  <nav aria-label="メイン" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 8px 30px; border-top: 1px solid #1E232B; background: #0D1014">
    <a href="Main.dc.html" style="text-decoration: none; color: #8C95A1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"></rect><path d="M8 3l4 3 4-3"></path></svg>
      <span>チャンネル</span>
    </a>
    <a href="Guide.dc.html" style="text-decoration: none; color: #8C95A1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"></rect><path d="M3 9h18M9 9v11M15 9v11"></path></svg>
      <span>番組表</span>
    </a>
    <a href="Radio.dc.html" style="text-decoration: none; color: #8C95A1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="9" width="18" height="11" rx="2.5"></rect><path d="M7 9l10-5"></path><circle cx="15.5" cy="14.5" r="2.5"></circle><path d="M6.5 13h4M6.5 16h4"></path></svg>
      <span>ラジオ</span>
    </a>
    <a href="Recordings.dc.html" style="text-decoration: none; color: {{accent}}; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="3.5" fill="currentColor"></circle></svg>
      <span>録画</span>
    </a>
    <a href="#" style="text-decoration: none; color: #8C95A1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>
      <span>設定</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5A524","options":["#F5A524","#4CC3FF","#FF6B5A","#9B8CFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'reserves' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#F5A524';
    const tab = this.state.tab;
    const tabs = [
      { id: 'reserves', label: '予約' },
      { id: 'recorded', label: '録画済み' },
      { id: 'rules', label: 'ルール' },
    ];
    const kind = {
      normal: { tag: '予約', tagFg: '#9AA3AE', dot: '#FF5A4E', border: '#1C2128' },
      rec: { tag: '● 録画中', tagFg: '#FF8A80', dot: '#FF5A4E', border: '#5A2A26' },
      conflict: { tag: '▲ 競合', tagFg: '#F5C04A', dot: '#F5C04A', border: '#5C4718' },
      rule: { tag: 'ルール予約', tagFg: '#9AA3AE', dot: '#FF5A4E', border: '#1C2128' },
    };
    const reserves = [
      ['今日', '18:00', '5 テレビ朝日', '[プロ野球中継]', 'rec'],
      ['今日', '21:00', '4 日テレ', '[映画]', 'conflict'],
      ['今日', '21:00', '1 NHK総合', '[報道特集]', 'conflict'],
      ['17(土)', '23:30', '7 テレビ東京', '[深夜アニメ]', 'rule'],
      ['18(日)', '21:00', '6 TBS', '[ドラマ]', 'normal'],
    ];
    return {
      accent,
      tabs: tabs.map((t) => ({
        ...t,
        selected: t.id === tab,
        pick: () => this.setState({ tab: t.id }),
        bg: t.id === tab ? accent : 'transparent',
        fg: t.id === tab ? '#1A1205' : '#B4BCC6',
      })),
      showReserves: tab === 'reserves',
      showRecorded: tab === 'recorded',
      showRules: tab === 'rules',
      reserves: reserves.map(([day, start, ch, title, k]) => ({ day, start, ch, title, ...kind[k] })),
      recorded: [
        { title: '[深夜アニメ] 第2話', meta: '7 テレビ東京 · 10/10(土) 23:30', dur: '30:00', files: 'TS · H.264 720p' },
        { title: '[ドキュメンタリー]', meta: '1 NHK総合 · 10/12(月) 22:00', dur: '49:00', files: 'TS のみ' },
        { title: '[ドラマ] 第1話', meta: '6 TBS · 10/11(日) 21:00', dur: '1:04:00', files: 'TS · H.264 720p' },
      ],
      rules: [
        { keyword: '[キーワード：アニメ作品名]', cond: '地上波 · 毎週 · 重複回避', count: '予約 1' },
        { keyword: '[キーワード：ドラマ名]', cond: 'TBS · 日曜 21:00', count: '予約 1' },
        { keyword: '[ジャンル：ドキュメンタリー]', cond: 'NHK総合 · 全曜日', count: '予約 0' },
      ],
    };
  }
}
</script>
</body>
</html>
